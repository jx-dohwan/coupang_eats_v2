<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일시적 오류 · Coupang Eats</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 45%, #f8fafc 100%);
      color: #0f172a;
    }
    .box {
      max-width: 28rem; padding: 2rem 1.5rem; text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 0.5rem; line-height: 1.5; color: #475569; font-size: 0.95rem; }
    a {
      display: inline-block; margin-top: 1.25rem; padding: 0.65rem 1.25rem;
      background: #0ea5e9; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;
    }
    a:hover { filter: brightness(0.95); }
    .code { font-size: 0.8rem; color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>잠시 서비스를 이용할 수 없습니다</h1>
    <p>서버가 준비 중이거나 일시적으로 응답하지 않습니다.</p>
    <p>잠시 후 다시 시도해 주세요.</p>
    <a href="/">홈으로 돌아가기</a>
    <p class="code">HTTP 502 / 503 / 504</p>
  </div>
</body>
</html>
