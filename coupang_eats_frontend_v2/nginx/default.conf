server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_intercept_errors on;
    error_page 502 503 504 /50x.html;
    error_page 500 /errors/500.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx/html;
    }

    # Nest API (/auth/verify-email 포함 — JSON API)
    location ~ ^/(health|auth|categories|restaurants|dishes|users|orders|payments|reviews|uploads)(/|$) {
        proxy_pass http://nest:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /api/ {
        proxy_pass http://nest:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA — /verify-email 메일 랜딩 포함
    location / {
        try_files $uri $uri/ /index.html;
    }
}
